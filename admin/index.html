<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản trị sản phẩm</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>

  <body>
    <header>
      <a href="../index.html">Phone Store</a>

      <nav aria-label="Điều hướng chính">
        <a href="../index.html">Về trang bán hàng</a>
      </nav>
    </header>

    <main>
      <h1>Quản trị sản phẩm</h1>

      <section aria-label="Công cụ quản lý sản phẩm">
        <label for="admin-search">Tìm theo tên</label>
        <input
          id="admin-search"
          type="search"
          placeholder="Nhập tên sản phẩm"
        />
        <label id="admin-sort-label" for="admin-sort">Sắp xếp theo giá</label>

        <div class="admin-sort-control">
          <select id="admin-sort">
            <option value="default">Mặc định</option>
            <option value="asc">Giá thấp đến cao</option>
            <option value="desc">Giá cao đến thấp</option>
          </select>
          <button
            id="admin-sort-trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="admin-sort-options"
            aria-labelledby="admin-sort-label admin-sort-value"
            hidden
          >
            <span id="admin-sort-value">Mặc định</span>
            <span class="select-chevron" aria-hidden="true"></span>
          </button>

          <div
            id="admin-sort-options"
            role="listbox"
            aria-labelledby="admin-sort-label"
            hidden
          >
            <button
              type="button"
              role="option"
              data-value="default"
              aria-selected="true"
            >
              Mặc định
            </button>
            <button
              type="button"
              role="option"
              data-value="asc"
              aria-selected="false"
            >
              Giá thấp đến cao
            </button>
            <button
              type="button"
              role="option"
              data-value="desc"
              aria-selected="false"
            >
              Giá cao đến thấp
            </button>
          </div>
        </div>

        <button type="button" id="add-product-button">Thêm sản phẩm</button>
      </section>

      <section
        id="product-form-section"
        aria-labelledby="product-form-title"
        hidden
      >
        <h2 id="product-form-title">Thêm sản phẩm</h2>

        <form id="product-form" novalidate>
          <label for="product-name">Tên sản phẩm</label>
          <input id="product-name" name="name" type="text" />

          <label for="product-price">Giá</label>
          <input id="product-price" name="price" type="number" step="any" />

          <label for="product-type">Loại sản phẩm</label>
          <select id="product-type" name="type">
            <option value="">Chọn loại</option>
            <option value="iphone">iPhone</option>
            <option value="samsung">Samsung</option>
          </select>

          <label for="product-screen">Màn hình</label>
          <input id="product-screen" name="screen" type="text" />

          <label for="product-back-camera">Camera sau</label>
          <input id="product-back-camera" name="backCamera" type="text" />

          <label for="product-front-camera">Camera trước</label>
          <input id="product-front-camera" name="frontCamera" type="text" />

          <label for="product-img">Đường dẫn ảnh</label>
          <input id="product-img" name="img" type="url" />

          <label for="product-desc">Mô tả</label>
          <textarea id="product-desc" name="desc" rows="3"></textarea>

          <p id="product-form-error" role="alert" hidden></p>

          <button type="submit" id="product-submit-button">Lưu sản phẩm</button>
          <button type="button" id="cancel-product-button">Hủy</button>
        </form>
      </section>

      <section aria-labelledby="admin-products-title">
        <h2 id="admin-products-title">Danh sách sản phẩm</h2>

        <table>
          <thead>
            <tr>
              <th scope="col">Ảnh</th>
              <th scope="col">Tên sản phẩm</th>
              <th scope="col">Loại</th>
              <th scope="col">Giá</th>
              <th scope="col">Thao tác</th>
            </tr>
          </thead>
          <tbody id="admin-product-list"></tbody>
        </table>
      </section>
    </main>

    <script src="../assets/js/vendor/axios.min.js"></script>
    <script type="module" src="../assets/js/admin.js"></script>
  </body>
</html>
